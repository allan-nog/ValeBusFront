<svg class="login-fundo__svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Gradiente Céu - Manhã (Nascer do Sol / Alvorada Dourada) -->
    <linearGradient id="grad-ceu-manha" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14345c"/>
      <stop offset="45%" stop-color="#2a5a8c"/>
      <stop offset="75%" stop-color="#ea7a38"/>
      <stop offset="100%" stop-color="#fbc565"/>
    </linearGradient>

    <!-- Gradiente Céu - Tarde (Ensolarado / Azul Radiante com Horizonte Quente) -->
    <linearGradient id="grad-ceu-tarde" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Gradiente Céu - Noite (Azul Petróleo Profundo & Índigo) -->
    <linearGradient id="grad-ceu-noite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070e1b"/>
      <stop offset="50%" stop-color="#0e1f38"/>
      <stop offset="85%" stop-color="#162e52"/>
      <stop offset="100%" stop-color="#1e3a64"/>
    </linearGradient>

    <!-- Brilho do Sol -->
    <radialGradient id="grad-sol" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="80%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Brilho da Lua -->
    <radialGradient id="grad-lua" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="85%" stop-color="#93c5fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Montanhas de Santa Rita do Sapucaí (Serra da Mantiqueira) -->
    <linearGradient id="grad-montanhas-fundo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- ════════════════════════════════════════════════════════
       1. CÉU DINÂMICO
       ════════════════════════════════════════════════════════ -->
  <rect class="camada-ceu camada-ceu--manha" width="1440" height="900" fill="url(#grad-ceu-manha)"/>
  <rect class="camada-ceu camada-ceu--tarde" width="1440" height="900" fill="url(#grad-ceu-tarde)"/>
  <rect class="camada-ceu camada-ceu--noite" width="1440" height="900" fill="url(#grad-ceu-noite)"/>

  <!-- ════════════════════════════════════════════════════════
       2. ASTROS (SOL / LUA / ESTRELAS)
       ════════════════════════════════════════════════════════ -->
  <!-- Estrelas (Visíveis à noite) -->
  <g class="elemento-estrelas" fill="#ffffff">
    <circle cx="120" cy="80" r="1.5" opacity="0.8" class="estrela-pisca"/>
    <circle cx="260" cy="140" r="1" opacity="0.6"/>
    <circle cx="380" cy="65" r="2" opacity="0.9" class="estrela-pisca"/>
    <circle cx="520" cy="110" r="1.2" opacity="0.5"/>
    <circle cx="680" cy="75" r="1.8" opacity="0.85" class="estrela-pisca"/>
    <circle cx="840" cy="130" r="1.2" opacity="0.6"/>
    <circle cx="960" cy="60" r="2.2" opacity="0.9" class="estrela-pisca"/>
    <circle cx="1110" cy="95" r="1.5" opacity="0.75"/>
    <circle cx="1250" cy="140" r="1" opacity="0.6"/>
    <circle cx="1370" cy="70" r="2" opacity="0.9" class="estrela-pisca"/>
  </g>

  <!-- Sol da Manhã (Nascente à Esquerda) -->
  <g class="elemento-sol-manha">
    <circle cx="220" cy="280" r="110" fill="url(#grad-sol)" opacity="0.6"/>
    <circle cx="220" cy="280" r="48" fill="#fef08a"/>
  </g>

  <!-- Sol da Tarde (Alto e Radiante) -->
  <g class="elemento-sol-tarde">
    <circle cx="1180" cy="160" r="130" fill="url(#grad-sol)" opacity="0.7"/>
    <circle cx="1180" cy="160" r="54" fill="#ffffff"/>
  </g>

  <!-- Lua da Noite (Crescente com Brilho) -->
  <g class="elemento-lua">
    <circle cx="1200" cy="150" r="70" fill="url(#grad-lua)" opacity="0.5"/>
    <!-- Lua Crescente -->
    <path d="M1210 120 A 35 35 0 1 0 1238 178 A 30 30 0 1 1 1210 120 Z" fill="#f8fafc"/>
  </g>

  <!-- ════════════════════════════════════════════════════════
       3. NUVENS SUAVES
       ════════════════════════════════════════════════════════ -->
  <g class="elemento-nuvens">
    <!-- Nuvem 1 (Desliza suavemente) -->
    <g class="nuvem-animada nuvem-animada--1" opacity="0.65">
      <path d="M 0 180 q 25 -30 60 -20 q 30 -40 70 -20 q 40 -10 60 20 q 30 0 40 20 z" fill="#ffffff"/>
    </g>
    <!-- Nuvem 2 -->
    <g class="nuvem-animada nuvem-animada--2" opacity="0.5">
      <path d="M 0 240 q 30 -25 70 -15 q 35 -35 80 -15 q 35 -10 60 15 q 25 0 35 15 z" fill="#ffffff"/>
    </g>
  </g>

  <!-- ════════════════════════════════════════════════════════
       4. MONTANHAS DE SANTA RITA DO SAPUCAÍ (Mantiqueira)
       ════════════════════════════════════════════════════════ -->
  <g class="camada-montanhas">
    <path d="M 0 620 Q 200 480 420 560 T 900 500 T 1440 580 L 1440 900 L 0 900 Z" fill="url(#grad-montanhas-fundo)"/>
  </g>

  <!-- ════════════════════════════════════════════════════════
       5. SILHUETA DOS PRÉDIOS E EDIFÍCIOS URBANOS
       ════════════════════════════════════════════════════════ -->
  <g class="camada-predios">
    <!-- Prédios de fundo (mais escuros) -->
    <rect x="40" y="520" width="85" height="280" rx="4" class="predio-fundo"/>
    <rect x="150" y="460" width="105" height="340" rx="4" class="predio-fundo"/>
    <rect x="280" y="570" width="75" height="230" rx="4" class="predio-fundo"/>
    <rect x="380" y="430" width="125" height="370" rx="4" class="predio-fundo"/>
    <rect x="530" y="490" width="95" height="310" rx="4" class="predio-fundo"/>
    <rect x="650" y="380" width="140" height="420" rx="4" class="predio-fundo"/>
    <rect x="815" y="470" width="115" height="330" rx="4" class="predio-fundo"/>
    <rect x="955" y="530" width="85" height="270" rx="4" class="predio-fundo"/>
    <rect x="1065" y="440" width="125" height="360" rx="4" class="predio-fundo"/>
    <rect x="1215" y="500" width="105" height="300" rx="4" class="predio-fundo"/>
    <rect x="1345" y="460" width="80" height="340" rx="4" class="predio-fundo"/>
  </g>

  <!-- ════════════════════════════════════════════════════════
       6. JANELAS DOS EDIFÍCIOS (Acendem à Noite / Manhã Cedo)
       ════════════════════════════════════════════════════════ -->
  <g class="camada-janelas">
    <!-- Prédio 150px -->
    <rect class="janela-pisca" x="170" y="480" width="12" height="18" rx="2"/>
    <rect class="janela-pisca--2" x="195" y="480" width="12" height="18" rx="2"/>
    <rect class="janela-pisca--3" x="220" y="520" width="12" height="18" rx="2"/>
    <rect class="janela-pisca--4" x="170" y="560" width="12" height="18" rx="2"/>

    <!-- Prédio 380px -->
    <rect class="janela-pisca--2" x="400" y="455" width="14" height="20" rx="2"/>
    <rect class="janela-pisca" x="430" y="455" width="14" height="20" rx="2"/>
    <rect class="janela-pisca--3" x="460" y="495" width="14" height="20" rx="2"/>
    <rect class="janela-pisca--4" x="400" y="535" width="14" height="20" rx="2"/>

    <!-- Prédio Central 650px -->
    <rect class="janela-pisca" x="675" y="410" width="16" height="22" rx="2"/>
    <rect class="janela-pisca--3" x="710" y="410" width="16" height="22" rx="2"/>
    <rect class="janela-pisca--2" x="745" y="450" width="16" height="22" rx="2"/>
    <rect class="janela-pisca--4" x="675" y="490" width="16" height="22" rx="2"/>
    <rect class="janela-pisca" x="745" y="530" width="16" height="22" rx="2"/>

    <!-- Prédio 1065px -->
    <rect class="janela-pisca--4" x="1085" y="470" width="14" height="20" rx="2"/>
    <rect class="janela-pisca--2" x="1120" y="470" width="14" height="20" rx="2"/>
    <rect class="janela-pisca" x="1155" y="510" width="14" height="20" rx="2"/>
  </g>

  <!-- ════════════════════════════════════════════════════════
       7. AVENIDA PRINCIPAL & ROTAS DE TRANSPORTE
       ════════════════════════════════════════════════════════ -->
  <g fill="none" stroke-linecap="round">
    <!-- Asfalto Principal -->
    <rect class="camada-asfalto" x="0" y="780" width="1440" height="120"/>
    <line class="linha-meio-fio" x1="0" y1="780" x2="1440" y2="780" stroke-width="4"/>

    <!-- Linhas Guia da Rota (Pontilhadas Animadas) -->
    <line class="rota-animada-h rota-principal" x1="-100" y1="840" x2="1540" y2="840" stroke-width="3" stroke-dasharray="16 12"/>
    <line class="rota-animada-h--lenta rota-secundaria" x1="-100" y1="815" x2="1540" y2="815" stroke-width="2" stroke-dasharray="12 10"/>
  </g>

  <!-- ════════════════════════════════════════════════════════
       8. PONTOS DE PARADA COM PING LUMINOSO
       ════════════════════════════════════════════════════════ -->
  <g class="camada-pontos-parada">
    <!-- Parada 1: INATEL -->
    <circle cx="280" cy="840" r="8" class="ponto-aura"/>
    <circle class="ponto-parada-ping" cx="280" cy="840" r="4" fill="none" stroke-width="2"/>
    <circle class="ponto-nucleo" cx="280" cy="840" r="4"/>

    <!-- Parada 2: Praça da Matriz -->
    <circle cx="750" cy="840" r="8" class="ponto-aura"/>
    <circle class="ponto-parada-ping--2" cx="750" cy="840" r="4" fill="none" stroke-width="2"/>
    <circle class="ponto-nucleo" cx="750" cy="840" r="4"/>

    <!-- Parada 3: Rodoviária -->
    <circle cx="1180" cy="840" r="8" class="ponto-aura"/>
    <circle class="ponto-parada-ping--3" cx="1180" cy="840" r="4" fill="none" stroke-width="2"/>
    <circle class="ponto-nucleo" cx="1180" cy="840" r="4"/>
  </g>

  <!-- ════════════════════════════════════════════════════════
       9. ÔNIBUS VALEBUS ANIMADOS EM OPERAÇÃO
       ════════════════════════════════════════════════════════ -->
  <!-- Ônibus 1 (Linha L03 Centro - Azul ValeBus) -->
  <g class="onibus-animado">
    <g transform="translate(-100, 822)">
      <!-- Farol de luz (cone iluminado à frente) -->
      <polygon class="farol-cone" points="48,8 140,0 140,24 48,16" opacity="0.35"/>
      <!-- Chassi do Ônibus -->
      <rect x="0" y="0" width="50" height="24" rx="5" fill="#1a6fd4"/>
      <!-- Janelas -->
      <rect x="32" y="4" width="12" height="10" rx="2" class="onibus-janela"/>
      <rect x="18" y="4" width="10" height="10" rx="2" class="onibus-janela"/>
      <rect x="5" y="4" width="9" height="10" rx="2" class="onibus-janela"/>
      <!-- Rodas -->
      <circle cx="11" cy="24" r="3.5" fill="#0f172a"/>
      <circle cx="39" cy="24" r="3.5" fill="#0f172a"/>
      <!-- Farol dianteiro -->
      <circle cx="48" cy="12" r="2.5" class="farol-lampada"/>
      <!-- Lanterna traseira -->
      <circle cx="2" cy="12" r="1.5" fill="#ef4444"/>
    </g>
  </g>

  <!-- Ônibus 2 (Linha L07 Campus - Verde ValeBus) -->
  <g class="onibus-animado--devagar">
    <g transform="translate(-160, 798)">
      <!-- Farol de luz -->
      <polygon class="farol-cone" points="44,8 130,2 130,22 44,14" opacity="0.3"/>
      <!-- Chassi do Ônibus -->
      <rect x="0" y="0" width="46" height="22" rx="4" fill="#16a34a"/>
      <!-- Janelas -->
      <rect x="30" y="4" width="10" height="9" rx="2" class="onibus-janela"/>
      <rect x="16" y="4" width="10" height="9" rx="2" class="onibus-janela"/>
      <rect x="5" y="4" width="7" height="9" rx="2" class="onibus-janela"/>
      <!-- Rodas -->
      <circle cx="10" cy="22" r="3" fill="#0f172a"/>
      <circle cx="36" cy="22" r="3" fill="#0f172a"/>
      <!-- Farol dianteiro -->
      <circle cx="44" cy="11" r="2" class="farol-lampada"/>
      <!-- Lanterna traseira -->
      <circle cx="2" cy="11" r="1.5" fill="#ef4444"/>
    </g>
  </g>
</svg>
