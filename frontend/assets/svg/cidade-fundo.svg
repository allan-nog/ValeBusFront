<svg class="login-fundo__svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="grad-ceu" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1628"/>
      <stop offset="60%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#1a365d"/>
    </linearGradient>
    <linearGradient id="grad-predio-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="grad-predio-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Céu Noturno -->
  <rect width="1440" height="900" fill="url(#grad-ceu)"/>

  <!-- Estrelas / Pontos brilhantes sutis -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="150" cy="100" r="1.5"/>
    <circle cx="380" cy="70" r="1"/>
    <circle cx="620" cy="140" r="1.5"/>
    <circle cx="890" cy="80" r="1"/>
    <circle cx="1120" cy="120" r="1.5"/>
    <circle cx="1340" cy="60" r="1"/>
  </g>

  <!-- Silhueta dos Prédios (Fundo) -->
  <g fill="url(#grad-predio-1)">
    <rect x="50" y="520" width="90" height="280" rx="4"/>
    <rect x="160" y="460" width="110" height="340" rx="4"/>
    <rect x="300" y="580" width="80" height="220" rx="4"/>
    <rect x="400" y="420" width="130" height="380" rx="4"/>
    <rect x="550" y="500" width="100" height="300" rx="4"/>
    <rect x="670" y="380" width="140" height="420" rx="4"/>
    <rect x="830" y="480" width="120" height="320" rx="4"/>
    <rect x="970" y="540" width="90" height="260" rx="4"/>
    <rect x="1080" y="440" width="130" height="360" rx="4"/>
    <rect x="1230" y="510" width="110" height="290" rx="4"/>
  </g>

  <!-- Janelas Iluminadas com Animações de Piscada -->
  <g fill="#fde047" opacity="0.8">
    <!-- Prédio 160px -->
    <rect class="janela-pisca" x="180" y="480" width="12" height="18" rx="2"/>
    <rect class="janela-pisca--2" x="205" y="480" width="12" height="18" rx="2"/>
    <rect class="janela-pisca--3" x="230" y="520" width="12" height="18" rx="2"/>
    <rect class="janela-pisca--4" x="180" y="560" width="12" height="18" rx="2"/>

    <!-- Prédio 400px -->
    <rect class="janela-pisca--2" x="420" y="450" width="14" height="20" rx="2"/>
    <rect class="janela-pisca" x="450" y="450" width="14" height="20" rx="2"/>
    <rect class="janela-pisca--3" x="480" y="490" width="14" height="20" rx="2"/>
    <rect class="janela-pisca--4" x="420" y="530" width="14" height="20" rx="2"/>

    <!-- Prédio Central 670px -->
    <rect class="janela-pisca" x="690" y="410" width="16" height="22" rx="2"/>
    <rect class="janela-pisca--3" x="725" y="410" width="16" height="22" rx="2"/>
    <rect class="janela-pisca--2" x="760" y="450" width="16" height="22" rx="2"/>
    <rect class="janela-pisca--4" x="690" y="490" width="16" height="22" rx="2"/>
    <rect class="janela-pisca" x="760" y="530" width="16" height="22" rx="2"/>

    <!-- Prédio 1080px -->
    <rect class="janela-pisca--4" x="1100" y="470" width="14" height="20" rx="2"/>
    <rect class="janela-pisca--2" x="1135" y="470" width="14" height="20" rx="2"/>
    <rect class="janela-pisca" x="1170" y="510" width="14" height="20" rx="2"/>
  </g>

  <!-- Estradas e Rotas de Ônibus -->
  <g fill="none" stroke-linecap="round">
    <!-- Asfalto Principal -->
    <rect x="0" y="780" width="1440" height="120" fill="#0f172a"/>
    <line x1="0" y1="780" x2="1440" y2="780" stroke="#334155" stroke-width="4"/>

    <!-- Linhas Guia da Rota (Pontilhadas Animadas) -->
    <line class="rota-animada-h" x1="-100" y1="840" x2="1540" y2="840" stroke="#38bdf8" stroke-width="3" stroke-dasharray="16 12" opacity="0.8"/>
    <line class="rota-animada-h--lenta" x1="-100" y1="815" x2="1540" y2="815" stroke="#f59e0b" stroke-width="2" stroke-dasharray="12 10" opacity="0.6"/>
  </g>

  <!-- Pontos de Parada da Cidade com Ping Pulsante -->
  <g>
    <!-- Ponto 1 -->
    <circle cx="280" cy="840" r="8" fill="#1a6fd4" opacity="0.3"/>
    <circle class="ponto-parada-ping" cx="280" cy="840" r="4" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="280" cy="840" r="4" fill="#38bdf8"/>

    <!-- Ponto 2 -->
    <circle cx="750" cy="840" r="8" fill="#1a6fd4" opacity="0.3"/>
    <circle class="ponto-parada-ping--2" cx="750" cy="840" r="4" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="750" cy="840" r="4" fill="#38bdf8"/>

    <!-- Ponto 3 -->
    <circle cx="1180" cy="840" r="8" fill="#1a6fd4" opacity="0.3"/>
    <circle class="ponto-parada-ping--3" cx="1180" cy="840" r="4" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="1180" cy="840" r="4" fill="#38bdf8"/>
  </g>

  <!-- Ônibus Animados em Movimento -->
  <g class="onibus-animado">
    <g transform="translate(-100, 822)">
      <rect x="0" y="0" width="48" height="24" rx="5" fill="#1a6fd4"/>
      <rect x="30" y="4" width="12" height="10" rx="2" fill="#e0f2fe"/>
      <rect x="16" y="4" width="10" height="10" rx="2" fill="#e0f2fe"/>
      <rect x="4" y="4" width="8" height="10" rx="2" fill="#e0f2fe"/>
      <circle cx="10" cy="24" r="3.5" fill="#0f172a"/>
      <circle cx="38" cy="24" r="3.5" fill="#0f172a"/>
      <circle cx="46" cy="12" r="2" fill="#fde047"/>
    </g>
  </g>

  <g class="onibus-animado--devagar">
    <g transform="translate(-160, 798)">
      <rect x="0" y="0" width="44" height="22" rx="4" fill="#16a34a"/>
      <rect x="28" y="4" width="10" height="9" rx="2" fill="#dcfce7"/>
      <rect x="14" y="4" width="10" height="9" rx="2" fill="#dcfce7"/>
      <rect x="4" y="4" width="6" height="9" rx="2" fill="#dcfce7"/>
      <circle cx="9" cy="22" r="3" fill="#0f172a"/>
      <circle cx="35" cy="22" r="3" fill="#0f172a"/>
      <circle cx="42" cy="11" r="1.5" fill="#fde047"/>
    </g>
  </g>
</svg>
