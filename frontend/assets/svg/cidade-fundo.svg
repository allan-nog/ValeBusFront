<!--
  cidade-fundo.svg
  ─────────────────
  Ilustração vetorial da cidade noturna usada como fundo da tela de login.

  As classes CSS (janela-pisca, rota-animada-h, onibus-animado, etc.)
  são definidas em css/login.css e controlam todas as animações.

  Como usar no HTML:
    <img src="../assets/svg/cidade-fundo.svg" ...>   ← NÃO usar: img não suporta CSS externo
    <object> ou <iframe>                              ← NÃO usar: complexo demais
    Injetado via JavaScript (login.js)                ← CORRETO: mantém acesso ao CSS
-->
